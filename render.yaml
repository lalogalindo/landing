services:
  - type: web
    name: mercsoft-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: mercsoft_db
      - key: RESEND_API_KEY
        sync: false
      - key: SENDER_EMAIL
        value: onboarding@resend.dev
      - key: RECIPIENT_EMAIL
        value: lalogalindo@gmail.com
      - key: RECAPTCHA_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "*"
